version: "3.8"
services:
  app:
    build: .
    container_name: nextjs
    env_file:
      - ./.env.production
    networks:
      - app-net

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl-private.key:/etc/ssl/ssl-private.key
      - ./nginx/ssl-bundle.crt:/etc/ssl/ssl-bundle.crt
    depends_on:
      - app
    networks:
      - app-net

name: fekrooneh
networks:
  app-net:
